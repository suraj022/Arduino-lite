[package]
name = "arduino-lite"
version = "0.1.0"
edition = "2021"
description = "A lightweight, modern GTK4 / libadwaita front-end for arduino-cli"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.8", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.6", features = ["v1_4"] }
sourceview5 = "0.8"
async-channel = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
