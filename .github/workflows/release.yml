
name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            jq \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package Linux binary
        shell: bash
        run: |
          APP_BIN=$(cargo metadata --no-deps --format-version 1 |
            jq -r '[.packages[0].targets[] |
            select(.kind | index("bin"))][0].name')

          mkdir -p dist

          cp "target/release/$APP_BIN" dist/

          tar -czf "dist/arduino-lite-linux-x86_64.tar.gz" \
            -C dist "$APP_BIN"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install GTK4 and GtkSourceView
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-jq
            zip

      - name: Build Windows binary
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"

          cargo build --release \
            --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"

          APP_BIN=$(cargo metadata --no-deps --format-version 1 |
            jq -r '[.packages[0].targets[] |
            select(.kind | index("bin"))][0].name')

          mkdir -p dist/arduino-lite

          cp "target/x86_64-pc-windows-gnu/release/$APP_BIN.exe" \
            dist/arduino-lite/

          # Include GTK and other MinGW runtime DLLs
          cp /mingw64/bin/*.dll dist/arduino-lite/

          # Include GTK and GtkSourceView runtime data
          cp -r /mingw64/share/gtk-4.0 dist/arduino-lite/ 2>/dev/null || true
          cp -r /mingw64/share/glib-2.0 dist/arduino-lite/ 2>/dev/null || true
          cp -r /mingw64/share/gtksourceview-5 dist/arduino-lite/ 2>/dev/null || true

          cd dist
          zip -r arduino-lite-windows-x86_64.zip arduino-lite

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.zip

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
