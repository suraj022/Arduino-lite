
name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ==========================================
  # LINUX BUILD
  # ==========================================

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            jq \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package Linux binary
        shell: bash
        run: |
          APP_BIN=$(cargo metadata --no-deps --format-version 1 |
            jq -r '[.packages[].targets[] |
            select(.kind | index("bin"))][0].name')

          mkdir -p dist

          cp "target/release/$APP_BIN" dist/

          tar -czf "dist/arduino-lite-linux-x86_64.tar.gz" \
            -C dist "$APP_BIN"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.tar.gz


  # ==========================================
  # WINDOWS BUILD
  # ==========================================

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-libadwaita
            jq
            zip

      - name: Build Windows binary
        shell: pwsh
        run: |
          # MSYS2 UCRT64 compiler and libraries
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"

          # Configure pkg-config for Windows GNU cross-compilation
          $env:PKG_CONFIG = "C:\msys64\ucrt64\bin\pkg-config.exe"

          $env:PKG_CONFIG_PATH = "C:\msys64\ucrt64\lib\pkgconfig;C:\msys64\ucrt64\share\pkgconfig"

          $env:PKG_CONFIG_ALLOW_CROSS = "1"

          $env:PKG_CONFIG_x86_64_pc_windows_gnu = "C:\msys64\ucrt64\bin\pkg-config.exe"

          $env:PKG_CONFIG_ALLOW_CROSS_x86_64_pc_windows_gnu = "1"

          # Verify dependencies
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1
          pkg-config --modversion gtksourceview-5

          # Identify executable
          $metadata = cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json

          $target = $metadata.packages.targets |
            Where-Object { $_.kind -contains "bin" } |
            Select-Object -First 1

          if (-not $target) {
            throw "No binary target found"
          }

          "APP_BIN=$($target.name)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Compile Windows application
          cargo build --release `
            --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        shell: msys2 {0}
        run: |
          mkdir -p dist/arduino-lite

          cp "target/x86_64-pc-windows-gnu/release/$APP_BIN.exe" \
            dist/arduino-lite/

          # Include Windows runtime DLLs
          cp /ucrt64/bin/*.dll dist/arduino-lite/

          # GTK runtime data
          cp -r /ucrt64/share/gtk-4.0 \
            dist/arduino-lite/ 2>/dev/null || true

          cp -r /ucrt64/share/glib-2.0 \
            dist/arduino-lite/ 2>/dev/null || true

          cp -r /ucrt64/share/gtksourceview-5 \
            dist/arduino-lite/ 2>/dev/null || true

          cp -r /ucrt64/share/icons \
            dist/arduino-lite/ 2>/dev/null || true

          cd dist

          zip -r arduino-lite-windows-x86_64.zip arduino-lite

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.zip


  # ==========================================
  # CREATE GITHUB RELEASE
  # ==========================================

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

